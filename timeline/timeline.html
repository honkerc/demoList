<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时间线 - TimeLine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text2: #6e6e73;
            --text3: #86868b;
            --line: #d2d2d7;
            --soft: #e8e8ed;
            --accent: #0071e3;
            --c1: #ff375f;
            --c2: #0071e3;
            --c3: #5e5ce6;
            --c4: #30d158;
            --c5: #ff9f0a;
            --c6: #ff6482;
            --c7: #bf5af2;
            --c8: #86868b;
            --empty: #e8e8ed;
            --bg-gradient: radial-gradient(ellipse at 30% 10%, #fff5f0, #fef3e8);
        }

        html.dark {
            --bg: #000000;
            --card: #1c1c1e;
            --text: #f5f5f7;
            --text2: #a1a1a6;
            --text3: #6e6e73;
            --line: #38383a;
            --soft: #2c2c2e;
            --accent: #2997ff;
            --c1: #ff453a;
            --c2: #2997ff;
            --c3: #5e5ce6;
            --c4: #30d158;
            --c5: #ff9f0a;
            --c6: #ff6482;
            --c7: #bf5af2;
            --c8: #6e6e73;
            --empty: #2c2c2e;
            --bg-gradient: radial-gradient(ellipse at 30% 10%, #1a1a1a, #000000);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            padding: 56px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header .left .date {
            font-size: 13px;
            font-weight: 600;
            color: var(--text3);
            letter-spacing: 0.5px;
        }

        .header .left .greeting {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--text);
            margin-top: 4px;
        }

        .header .left .greeting .highlight {
            background: linear-gradient(135deg, var(--c2), var(--c5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .content {
            flex: 1;
            padding: 0 24px 100px;
            overflow-y: auto;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        /* Date Navigator */
        .date-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 0 16px;
        }

        .date-nav .nav-btn {
            background: var(--card);
            border: 1px solid var(--line);
            font-size: 16px;
            color: var(--text2);
            cursor: pointer;
            padding: 8px 14px;
            transition: all 0.2s;
            font-weight: 600;
            border-radius: 999px;
            font-family: inherit;
        }

        .date-nav .nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .date-nav .date-label {
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            color: var(--text);
        }

        .date-nav .date-label .weekday {
            font-size: 11px;
            font-weight: 500;
            color: var(--text3);
            display: block;
            margin-top: 2px;
        }

        /* Daily Summary */
        .daily-summary {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .summary-item {
            flex: 1;
            background: var(--card);
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid var(--line);
        }

        .summary-item .value {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
        }

        .summary-item .label {
            font-size: 10px;
            color: var(--text3);
            margin-top: 4px;
            font-weight: 600;
        }

        /* Timeline List */
        .tl-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tl-item {
            display: flex;
            align-items: stretch;
            gap: 12px;
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--line);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tl-item:hover {
            border-color: var(--accent);
        }

        .tl-item .tl-color {
            width: 4px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .tl-item .tl-body {
            flex: 1;
            min-width: 0;
        }

        .tl-item .tl-time {
            font-size: 11px;
            font-weight: 600;
            color: var(--text3);
            font-variant-numeric: tabular-nums;
        }

        .tl-item .tl-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-top: 2px;
        }

        .tl-item .tl-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }

        .tl-item .tl-cat {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            color: #fff;
        }

        .tl-item .tl-dur {
            font-size: 12px;
            font-weight: 700;
            color: var(--text2);
            font-variant-numeric: tabular-nums;
        }

        .tl-gap {
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text3);
            padding: 4px 0;
            letter-spacing: 0.5px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text3);
            font-weight: 500;
        }

        /* Nav */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: color-mix(in srgb, var(--card) 85%, transparent);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--line);
            display: flex;
            padding: 8px 24px 28px;
            z-index: 100;
            gap: 4px;
        }

        .nav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text3);
            padding: 8px 0;
            text-decoration: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: var(--soft);
        }

        .nav a.on {
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 8%, transparent);
        }

        @media (min-width: 768px) {
            .app {
                margin: 20px auto;
                min-height: 90vh;
                border-radius: 28px;
                overflow: hidden;
            }

            .nav {
                border-radius: 0 0 28px 28px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="header">
            <div class="left">
                <div class="date" id="todayDate"></div>
                <div class="greeting">时间线</div>
            </div>
        </div>
        <div class="content">
            <div class="date-nav">
                <button class="nav-btn" onclick="changeDate(-1)">←</button>
                <div class="date-label" id="dateLabel">
                    2026年5月18日
                    <span class="weekday" id="weekdayLabel">星期一</span>
                </div>
                <button class="nav-btn" onclick="changeDate(1)">→</button>
            </div>
            <div class="daily-summary" id="dailySummary">
                <div class="summary-item">
                    <div class="value" id="sumTotal">0h</div>
                    <div class="label">总记录</div>
                </div>
                <div class="summary-item">
                    <div class="value" id="sumCount">0</div>
                    <div class="label">活动数</div>
                </div>
                <div class="summary-item">
                    <div class="value" id="sumRate">0%</div>
                    <div class="label">利用率</div>
                </div>
            </div>
            <div class="tl-list" id="tlContainer">
                <div class="empty-state">
                    <p>暂无记录</p>
                </div>
            </div>
        </div>

        <div class="nav">
            <a href="index.html">记录</a>
            <a href="tasks.html">任务</a>
            <a class="on" href="timeline.html">时间线</a>
            <a href="dashboard.html">看板</a>
            <a href="profile.html">我的</a>
        </div>
    </div>

    <script>
        let currentDate = new Date();

        (function () {
            const saved = localStorage.getItem('timeline_theme');
            const isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) document.documentElement.classList.add('dark');
        })();

        function getRecords() { return JSON.parse(localStorage.getItem('timeline_records') || '[]'); }

        function fmt(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
        }

        function cc(cat) {
            const m = { '工作': 'var(--c1)', '学习': 'var(--c2)', '阅读': 'var(--c3)', '运动': 'var(--c4)', '创作': 'var(--c5)', '社交': 'var(--c6)', '休息': 'var(--c7)', '其他': 'var(--c8)' };
            return m[cat] || 'var(--text3)';
        }

        function updateDateLabel() {
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth() + 1;
            const d = currentDate.getDate();
            const w = days[currentDate.getDay()];
            document.getElementById('dateLabel').innerHTML = y + '年' + m + '月' + d + '日';
            document.getElementById('weekdayLabel').textContent = '周' + w;
            document.getElementById('todayDate').textContent = y + '年' + String(m).padStart(2, '0') + '月' + String(d).padStart(2, '0') + '日 周' + w;
        }

        function changeDate(delta) {
            currentDate.setDate(currentDate.getDate() + delta);
            updateDateLabel();
            renderTimeline();
        }

        function renderTimeline() {
            const records = getRecords();
            const dateStr = currentDate.getFullYear() + '-' +
                String(currentDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(currentDate.getDate()).padStart(2, '0');

            const dayRecords = records.filter(r => r.date === dateStr);
            dayRecords.sort((a, b) => (a.start || '00:00').localeCompare(b.start || '00:00'));

            let totalSec = 0;
            dayRecords.forEach(r => totalSec += r.duration);
            const goal = 8 * 3600;
            const rate = goal > 0 ? Math.min(100, Math.round(totalSec / goal * 100)) : 0;
            document.getElementById('sumTotal').textContent = fmt(totalSec);
            document.getElementById('sumCount').textContent = dayRecords.length;
            document.getElementById('sumRate').textContent = rate + '%';

            const container = document.getElementById('tlContainer');
            if (dayRecords.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>' + dateStr + ' 暂无记录</p></div>';
                return;
            }

            let html = '';
            let lastEnd = null;
            dayRecords.forEach((r, i) => {
                if (lastEnd && r.start) {
                    if (lastEnd < r.start) {
                        html += '<div class="tl-gap">' + lastEnd + ' — ' + r.start + '</div>';
                    }
                }
                const color = cc(r.category);
                const catTag = '<span class="tl-cat" style="background:' + color + ';">' + r.category + '</span>';
                html += '<div class="tl-item" onclick="deleteRecord(' + r.id + ')">' +
                    '<div class="tl-color" style="background:' + color + ';"></div>' +
                    '<div class="tl-body">' +
                    '<div class="tl-time">' + (r.start || '--:--') + ' — ' + (r.end || '--:--') + '</div>' +
                    '<div class="tl-name">' + r.name + '</div>' +
                    '<div class="tl-bottom">' + catTag + '<span class="tl-dur">' + fmt(r.duration) + '</span></div>' +
                    '</div></div>';
                lastEnd = r.end || null;
            });
            container.innerHTML = html;
        }

        function deleteRecord(id) {
            if (confirm('删除这条记录？')) {
                let records = getRecords();
                records = records.filter(r => r.id !== id);
                localStorage.setItem('timeline_records', JSON.stringify(records));
                renderTimeline();
            }
        }

        updateDateLabel();
        renderTimeline();
    </script>
</body>

</html>
