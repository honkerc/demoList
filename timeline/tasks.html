<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>任务 - TimeLine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --text2: #6e6e73;
            --text3: #86868b;
            --line: #d2d2d7;
            --soft: #e8e8ed;
            --accent: #0071e3;
            --c1: #ff375f;
            --c2: #0071e3;
            --c3: #5e5ce6;
            --c4: #30d158;
            --c5: #ff9f0a;
            --c6: #ff6482;
            --c7: #bf5af2;
            --c8: #86868b;
            --empty: #e8e8ed;
            --bg-gradient: radial-gradient(ellipse at 30% 10%, #fff5f0, #fef3e8);
        }

        html.dark {
            --bg: #000000;
            --card: #1c1c1e;
            --text: #f5f5f7;
            --text2: #a1a1a6;
            --text3: #6e6e73;
            --line: #38383a;
            --soft: #2c2c2e;
            --accent: #2997ff;
            --c1: #ff453a;
            --c2: #2997ff;
            --c3: #5e5ce6;
            --c4: #30d158;
            --c5: #ff9f0a;
            --c6: #ff6482;
            --c7: #bf5af2;
            --c8: #6e6e73;
            --empty: #2c2c2e;
            --bg-gradient: radial-gradient(ellipse at 30% 10%, #1a1a1a, #000000);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            padding: 56px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header .left .date {
            font-size: 13px;
            font-weight: 600;
            color: var(--text3);
            letter-spacing: 0.5px;
        }

        .header .left .greeting {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--text);
            margin-top: 4px;
        }

        .content {
            flex: 1;
            padding: 0 24px 100px;
            overflow-y: auto;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        /* Add Form */
        .add-form {
            display: flex;
            gap: 8px;
            margin: 24px 0 20px;
        }

        .add-form input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            background: var(--card);
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }

        .add-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .add-form input::placeholder {
            color: var(--text3);
        }

        .add-form button {
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--accent);
            color: #fff;
            white-space: nowrap;
        }

        .add-form button:hover {
            opacity: 0.85;
        }

        .add-form button:active {
            transform: scale(0.97);
        }

        /* Task List */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: var(--accent);
        }

        .task-item .check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--line);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s;
            font-size: 11px;
            color: transparent;
        }

        .task-item.done .check {
            background: var(--c4);
            border-color: var(--c4);
            color: #fff;
        }

        .task-item .body {
            flex: 1;
            min-width: 0;
        }

        .task-item .body .name {
            font-size: 14px;
            font-weight: 600;
            transition: all 0.25s;
        }

        .task-item.done .body .name {
            text-decoration: line-through;
            color: var(--text3);
        }

        .task-item .body .meta {
            font-size: 11px;
            color: var(--text3);
            margin-top: 2px;
            font-weight: 500;
        }

        .task-item .del {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            color: var(--text3);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .task-item .del:hover {
            background: color-mix(in srgb, var(--c1) 12%, transparent);
            color: var(--c1);
        }

        /* Empty */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state p {
            font-size: 14px;
            color: var(--text3);
            font-weight: 500;
        }

        /* Nav */
        .nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: color-mix(in srgb, var(--card) 85%, transparent);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--line);
            display: flex;
            padding: 8px 24px 28px;
            z-index: 100;
            gap: 4px;
        }

        .nav a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text3);
            padding: 8px 0;
            text-decoration: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: var(--soft);
        }

        .nav a.on {
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 8%, transparent);
        }

        @media (min-width: 768px) {
            .app {
                margin: 20px auto;
                min-height: 90vh;
                border-radius: 28px;
                overflow: hidden;
            }

            .nav {
                border-radius: 0 0 28px 28px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="header">
            <div class="left">
                <div class="date" id="todayDate"></div>
                <div class="greeting">任务清单</div>
            </div>
        </div>
        <div class="content">
            <div class="add-form">
                <input type="text" id="taskInput" placeholder="添加新任务..." maxlength="100">
                <button onclick="addTask()">添加</button>
            </div>

            <div class="task-list" id="taskList">
                <div class="empty-state">
                    <p>暂无任务，添加一个吧</p>
                </div>
            </div>
        </div>

        <div class="nav">
            <a href="index.html">记录</a>
            <a class="on" href="tasks.html">任务</a>
            <a href="timeline.html">时间线</a>
            <a href="dashboard.html">看板</a>
            <a href="profile.html">我的</a>
        </div>
    </div>

    <script>
        function getTasks() { return JSON.parse(localStorage.getItem('timeline_tasks') || '[]'); }
        function saveTasks(t) { localStorage.setItem('timeline_tasks', JSON.stringify(t)); }

        function addTask() {
            const input = document.getElementById('taskInput');
            const name = input.value.trim();
            if (!name) { alert('请输入任务内容'); return; }
            const tasks = getTasks();
            tasks.push({ id: Date.now(), name, done: false, created_at: new Date().toISOString() });
            saveTasks(tasks);
            input.value = '';
            render();
        }

        function toggleTask(id) {
            const tasks = getTasks();
            const t = tasks.find(t => t.id === id);
            if (t) { t.done = !t.done; saveTasks(tasks); render(); }
        }

        function deleteTask(id) {
            let tasks = getTasks();
            tasks = tasks.filter(t => t.id !== id);
            saveTasks(tasks);
            render();
        }

        function render() {
            const tasks = getTasks();
            tasks.sort((a, b) => {
                if (a.done !== b.done) return a.done ? 1 : -1;
                return b.id - a.id;
            });

            const container = document.getElementById('taskList');
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>暂无任务，添加一个吧</p></div>';
                return;
            }

            container.innerHTML = tasks.map(t => {
                const cls = t.done ? 'task-item done' : 'task-item';
                const check = t.done ? '✓' : '';
                const date = t.created_at ? t.created_at.slice(0, 10) : '';
                return '<div class="' + cls + '" onclick="toggleTask(' + t.id + ')">' +
                    '<div class="check">' + check + '</div>' +
                    '<div class="body">' +
                    '<div class="name">' + esc(t.name) + '</div>' +
                    '<div class="meta">' + date + '</div>' +
                    '</div>' +
                    '<button class="del" onclick="event.stopPropagation();deleteTask(' + t.id + ')">✕</button>' +
                    '</div>';
            }).join('');
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function updateDate() {
            const now = new Date();
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            document.getElementById('todayDate').textContent = now.getFullYear() + '年' + m + '月' + d + '日 周' + days[now.getDay()];
        }

        document.getElementById('taskInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') addTask();
        });

        updateDate();
        render();
    </script>
</body>

</html>
