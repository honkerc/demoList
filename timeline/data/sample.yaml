      - 会议
      - 文档
      - 设计

  - id: study
    name: 学习
    icon: 📚
    color: "#34C759"
    tags:
      - 课程
      - 实践
      - 笔记整理

  - id: reading
    name: 阅读
    icon: 📖
    color: "#5856D6"
    tags:
      - 技术书籍
      - 人文社科
      - 文章

  - id: sport
    name: 运动
    icon: 🏃
    color: "#FF3B30"
    tags:
      - 跑步
      - 力量训练
      - 瑜伽

  - id: creation
    name: 创作
    icon: 🎨
    color: "#FF2D55"
    tags:
      - 写作
      - 绘画
      - 音乐

  - id: social
    name: 社交
    icon: 💬
    color: "#FF9500"
    tags:
      - 朋友聚会
      - 家庭时间
      - 网络社交

  - id: rest
    name: 休息
    icon: ☕
    color: "#FF9500"
    tags:
      - 午休
      - 冥想
      - 散步

  - id: other
    name: 其他
    icon: 📌
    color: "#C7C7CC"
    tags:
      - 通勤
      - 家务
      - 杂事

# ===== 每日目标 =====
goals:
  daily_focus: 8h       # 每日专注目标
  weekly_reading: 5h    # 每周阅读目标
  weekly_sport: 3h      # 每周运动目标

# ===== 时间记录 =====
# 格式说明：
#   date: 日期
#   activities: 活动列表
#     - start: 开始时间 (HH:MM)
#       end: 结束时间 (HH:MM)
#       category: 分类ID
#       tag: 标签
#       description: 活动描述
#       note: 备注（可选）

