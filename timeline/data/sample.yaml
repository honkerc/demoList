# ===== GitHub 同步配置 =====
github:
  enabled: true
  repository: "clay/timeline-data"
  branch: "main"
  auto_commit:
    enabled: true
    time: "23:00"           # 每日自动提交时间
    timezone: "Asia/Shanghai"
  data_format: "yaml"       # yaml / json
  actions:
    - weekly_report         # 自动生成周报
    - monthly_report        # 自动生成月报
    - trend_analysis        # 趋势分析
